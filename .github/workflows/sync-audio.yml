name: Sync catalog audio
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'audio/**'

permissions:
  contents: read
  issues: write

concurrency:
  group: sync-catalog-audio
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reconcile owned submissions
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/sync-audio-issues.mjs
